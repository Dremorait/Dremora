name: Auto-merge & Deploy

on:
  push:
    branches:
      - redesign/astro-site

jobs:
  merge-to-main:
    name: Merge → main (triggers Vercel)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge redesign/astro-site → main
        run: |
          git merge origin/redesign/astro-site --no-edit --ff-only || \
          git merge origin/redesign/astro-site --no-edit

      - name: Push to main
        run: git push origin main
